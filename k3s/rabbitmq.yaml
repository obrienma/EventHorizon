# ── RabbitMQ: In-Cluster Message Broker ────────────────────────────────────────
# Single-replica Deployment + PVC + ClusterIP Service, per ADR 0020.
# Mirrors docker-compose.yml's local dev broker (same image, same ports) —
# with one deliberate difference: credentials are NOT guest/guest here.
#
# RabbitMQ hardcodes a localhost-only connection restriction on the literal
# username "guest", for every protocol including AMQP, regardless of what
# password it's given (https://www.rabbitmq.com/docs/access-control). That's
# invisible in docker-compose because the app runs on the host and reaches
# RabbitMQ via a published port, which presents as loopback. In this
# cluster, server/worker are separate pods reaching this Service over the
# pod network — not loopback — so guest/guest would reject every
# connection with "user 'guest' can only connect via localhost". A
# dedicated user avoids the restriction entirely, which RabbitMQ's own
# docs recommend over disabling the loopback check.
#
# DNS name this satisfies: rabbitmq.event-horizon.svc.cluster.local
# (configmap.yaml's RABBITMQ_HOST). config.ts builds both RABBITMQ_URL and
# RABBITMQ_MANAGEMENT_URL from that host plus the same RABBITMQ_USER/
# RABBITMQ_PASSWORD this Deployment uses to bootstrap the broker itself —
# one pair of credentials, not four fields to keep in sync.
#
# Not HA: a single replica with one PVC is a demo-scale posture, matching
# the resource-conscious limits on server.yaml/worker.yaml. Revisit if
# broker availability ever becomes a felt problem, not before.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: event-horizon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: event-horizon
spec:
  replicas: 1
  strategy:
    # Single PVC can't be mounted by two pods at once — a rolling update
    # would deadlock waiting for the old pod to release it.
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 15692
              name: metrics
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: event-horizon-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: event-horizon-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 20
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: event-horizon
spec:
  selector:
    app: rabbitmq
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
    - port: 15692
      targetPort: 15692
      name: metrics