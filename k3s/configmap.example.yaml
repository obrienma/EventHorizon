apiVersion: v1
kind: ConfigMap
metadata:
  name: event-horizon-config
  namespace: event-horizon
data:
  # Server
  PORT: "3000"
  HOST: "0.0.0.0"

  # MongoDB — in-cluster (mongodb.yaml), per ADR 0023. Non-secret: the
  # connection is unauthenticated (ClusterIP-only, never externally
  # exposed), so there's no password to keep in secret.yaml. Matches
  # mongodb.yaml's Service DNS name and --replSet rs0.
  MONGO_URI: "mongodb://mongodb.event-horizon.svc.cluster.local:27017/eventhorizon?replicaSet=rs0"
  MONGO_DB_NAME: "your-dbname"

  # RabbitMQ — non-secret config. config.ts builds RABBITMQ_URL and
  # RABBITMQ_MANAGEMENT_URL from this host plus RABBITMQ_USER/
  # RABBITMQ_PASSWORD in secret.yaml, so the credentials only ever live in
  # one place (no separate pre-built URL fields to keep in sync). Matches
  # rabbitmq.yaml's Service DNS name — no port (config.ts appends
  # :5672/:15672 for AMQP vs. the management API).
  RABBITMQ_HOST: "rabbitmq.event-horizon.svc.cluster.local"

  # Queue / exchange topology — must match the values used when the broker
  # topology was first declared. Changing these requires draining the old
  # queues first (the declarations are idempotent only with identical args).
  EXCHANGE_NAME: "events"
  QUEUE_NAME: "events.work"
  DEAD_LETTER_QUEUE: "events.dead"

  # Worker backpressure
  WORKER_PREFETCH: "5"

  # Queue depth alert thresholds for the dashboard status indicator
  QUEUE_DEPTH_WARNING: "50"
  QUEUE_DEPTH_CRITICAL: "200"

  # Observability intervals (milliseconds)
  STATS_PUSH_INTERVAL_MS: "5000"
  METRICS_RATE_WINDOW_MS: "10000"
  EVENT_DISTRIBUTION_POLL_MS: "10000"