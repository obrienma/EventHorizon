# Template. Copy to secret.yaml before filling in real values:
#   cp k3s/secret.example.yaml k3s/secret.yaml
# k3s/secret.yaml is gitignored — real credentials placed there can't be
# accidentally committed. Generate base64 values:
#   echo -n "your-atlas-password" | base64
#
# In production, use a secrets manager (Vault, Sealed Secrets, SOPS, or the
# cloud provider's secret store) instead of a plaintext-base64 Secret file.
apiVersion: v1
kind: Secret
metadata:
  name: event-horizon-secrets
  namespace: event-horizon
type: Opaque
data:
  # MongoDB Atlas database user password — REPLACE before applying.
  # Paired with MONGO_HOST/MONGO_USERNAME in configmap.yaml; config.ts
  # builds the mongodb+srv:// URI from all three.
  MONGO_PASSWORD: ""
  # Credentials for the in-cluster RabbitMQ Deployment (rabbitmq.yaml) and
  # for this app's own connection to it — config.ts builds RABBITMQ_URL and
  # RABBITMQ_MANAGEMENT_URL from these plus RABBITMQ_HOST in configmap.yaml.
  # Must NOT be "guest" — RabbitMQ hardcodes a localhost-only restriction on
  # that specific username, for every protocol including AMQP, which would
  # reject every pod-to-pod connection in this cluster.
  RABBITMQ_USER: ""
  RABBITMQ_PASSWORD: ""
